apiVersion: v1
kind: Service
metadata:
  name: {{ include "muninn.fullname" . }}-ingestion
  labels:
    {{- include "muninn.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "muninn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
