apiVersion: v1
kind: Service
metadata:
  name: {{ include "muninn.fullname" . }}-query
  labels:
    {{- include "muninn.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  type: {{ .Values.query.service.type }}
  ports:
    - port: {{ .Values.query.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "muninn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: query
