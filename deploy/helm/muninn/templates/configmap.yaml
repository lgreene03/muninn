apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "muninn.fullname" . }}-config
  labels:
    {{- include "muninn.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.global.environment | quote }}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.global.redpanda.bootstrapServers | quote }}
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"
  SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
  
  MUNINN_TOPICS_TRADE: {{ .Values.global.redpanda.topics.trade | quote }}
  MUNINN_TOPICS_BOOK_SNAPSHOT: {{ .Values.global.redpanda.topics.bookSnapshot | quote }}
  MUNINN_TOPICS_FEATURE_OUTPUT: {{ .Values.global.redpanda.topics.featureOutput | quote }}
  MUNINN_TOPICS_REPLAY_OUTPUT: {{ .Values.global.redpanda.topics.replayOutput | quote }}
  MUNINN_TOPICS_DEAD_LETTER: {{ .Values.global.redpanda.topics.deadLetter | quote }}

  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}/{{ .Values.global.postgres.database }}"
  SPRING_DATASOURCE_USERNAME: {{ .Values.global.postgres.username | quote }}

  AWS_S3_ENDPOINT: {{ .Values.global.minio.endpoint | quote }}
  AWS_S3_BUCKET: {{ .Values.global.minio.bucketName | quote }}
  AWS_S3_PATH_STYLE_ACCESS: "true"

  MANAGEMENT_OTEL_TRACING_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.telemetry.otelExporterEndpoint | quote }}
  MANAGEMENT_OTEL_TRACING_SAMPLING_PROBABILITY: {{ .Values.global.telemetry.otelTraceSampleProbability | quote }}
