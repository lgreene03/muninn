server:
  port: 8080

spring:
  application:
    name: muninn
  datasource:
    url: jdbc:postgresql://localhost:5433/muninn
    username: muninn
    password: muninn
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.muninn.shared.event
        spring.json.type.mapping: >
          tradeEvent:io.muninn.shared.event.TradeEvent,
          candleEvent:io.muninn.shared.event.CandleEvent,
          orderBookSnapshotEvent:io.muninn.shared.event.OrderBookSnapshotEvent,
          featureComputedEvent:io.muninn.shared.event.FeatureComputedEvent
  flyway:
    enabled: true

muninn:
  query:
    # Storage engine the Query API delegates feature reads to.
    # Values: "duckdb" (default — reads Parquet via DuckDB httpfs)
    #         "trino"  (production-reference — reads Iceberg via Trino JDBC)
    # See docs/adr/0006-trino-query-backend.md.
    backend: duckdb
    trino:
      host: localhost
      port: 8080
      user: muninn
      catalog: iceberg
      schema: muninn
      ssl: false
  archival:
    # Sink the archival consumer flushes feature batches to.
    # Values: "parquet" (default — writes Hive-partitioned Parquet to MinIO/S3)
    #         "iceberg" (production-reference — appends to Iceberg + Glue)
    # See docs/adr/0007-iceberg-feature-sink.md.
    sink: parquet
    iceberg:
      catalog-type: glue
      warehouse: s3://muninn-warehouse
      glue-database: muninn
      aws-region: us-east-1
      schema: muninn
  duckdb:
    path: ":memory:"
  storage:
    s3:
      endpoint: http://localhost:9002
      access-key: minioadmin
      secret-key: minioadmin
      region: us-east-1
    buckets:
      raw: muninn-raw
      warehouse: muninn-warehouse
  stream:
    topics: events.trade
    group-id: muninn-processor
  ingestion:
    binance:
      enabled: true
      base-url: wss://stream.binance.com:9443
      instruments:
        - btcusdt
      streams:
        - trade
        - depth20@100ms
      reconnect:
        initial-delay-ms: 1000
        max-delay-ms: 60000
        jitter: true
  features:
    engine:
      enabled: true
      window-duration: PT1M
      checkpoint-interval: PT5M
      code-version: dev
      late-event-policy: drop

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: muninn
  tracing:
    sampling:
      probability: 1.0
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
