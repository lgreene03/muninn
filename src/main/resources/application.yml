server:
  port: 8080

spring:
  application:
    name: muninn
  datasource:
    url: jdbc:postgresql://localhost:5432/muninn
    username: muninn
    password: muninn
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.muninn.event
  flyway:
    enabled: true

muninn:
  duckdb:
    path: ":memory:"
  storage:
    s3:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      region: us-east-1
    buckets:
      raw: muninn-raw
      warehouse: muninn-warehouse
  stream:
    topics: events
    group-id: muninn-processor

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
