spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/muninn_test
    username: muninn
    password: muninn
  kafka:
    # bootstrap-servers is supplied by each test via @DynamicPropertySource
    # (Testcontainers Kafka address). Do not hardcode a default here — it
    # would shadow the dynamic value at producer-factory init time.
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Mirror production: wrap the JSON deserializer in ErrorHandlingDeserializer so the
      # poison-message path is exercised under test, not just in production config.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: io.muninn.shared.event
        spring.json.type.mapping: >
          tradeEvent:io.muninn.shared.event.TradeEvent,
          candleEvent:io.muninn.shared.event.CandleEvent,
          orderBookSnapshotEvent:io.muninn.shared.event.OrderBookSnapshotEvent,
          featureComputedEvent:io.muninn.shared.event.FeatureComputedEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

muninn:
  duckdb:
    path: ":memory:"
  storage:
    s3:
      # Deliberately unreachable: port 1 refuses connections at once. Tests that
      # need object storage start their own container and set their own endpoint
      # (see StorageConfigIntegrationTest, RawEventRecorderIntegrationTest).
      #
      # This used to be localhost:9000, which reaches whatever a developer happens
      # to be running. On one machine a local MinIO on that port, with minioadmin
      # credentials and a muninn-checkpoints bucket, received checkpoints from
      # integration-test runs. The feature engine restores its latest checkpoint at
      # startup, so later runs resumed stale windows and the live-versus-replay
      # parity test failed intermittently, on a branch that was not at fault. CI
      # has nothing on that port, which is why it only ever failed locally. Now
      # local behaves exactly like CI.
      endpoint: http://127.0.0.1:1
      access-key: minioadmin
      secret-key: minioadmin
  ingestion:
    binance:
      enabled: false
  features:
    engine:
      enabled: false
      window-duration: PT1M
      checkpoint-interval: PT5M
      code-version: test
      late-event-policy: drop
