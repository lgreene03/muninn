# Norse Stack — all four services on a shared Redpanda broker.
#
# Usage:
#   docker compose -f docker-compose.stack.yml up -d --build
#   bash scripts/smoke-stack.sh
#   docker compose -f docker-compose.stack.yml down -v
#
# Requires sibling checkouts: ../huginn, ../sleipnir, ../muninn-py
# Sleipnir runs in sim mode (no Binance credentials needed).
# Huginn runs with live_execution=true (publishes intents to Kafka).

services:

  # ── Shared infrastructure ─────────────────────────────────────────────

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-muninn:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muninn
      POSTGRES_USER: muninn
      POSTGRES_PASSWORD: muninn
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muninn"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-huginn:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: huginn
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for raw events, the Iceberg warehouse and
  # checkpoints. SeaweedFS replaced MinIO on 2026-10-01. MinIO withdrew
  # anonymous pulls from both quay.io and Docker Hub: the pinned tag, `latest`
  # and `mc` all refuse a valid anonymous token. A fresh machine or CI runner
  # could not start this stack at all, while existing machines kept working only
  # off a cached image, which is how it went unnoticed. Moving to a third MinIO
  # registry would repeat the mistake. SeaweedFS is Apache 2.0, community
  # published, and passed the S3 contract this stack depends on (multipart,
  # ranged reads, prefix and delimiter listing, enforced credentials).
  #
  # The network alias `minio` keeps every existing `http://minio:9000` endpoint
  # working unchanged: application config, Helm values and muninn-py's CI. The
  # credentials are local-development defaults, not secrets.
  objectstore:
    image: chrislusf/seaweedfs:3.97
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256 -volume.max=0
    networks:
      default:
        aliases: [minio]
    ports:
      - "9002:9000"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Idempotent. Re-running against existing buckets preserves their contents
  # (verified), matching the old `mc mb --ignore-existing`.
  objectstore-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      for b in muninn-raw muninn-warehouse muninn-checkpoints; do
        echo s3.bucket.create -name $$b | weed shell -master=objectstore:9333 || exit 1;
      done;
      echo buckets ready
      "

  # ── Application services ──────────────────────────────────────────────

  muninn:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres-muninn:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-muninn:5432/muninn
      SPRING_DATASOURCE_USERNAME: muninn
      SPRING_DATASOURCE_PASSWORD: muninn
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      MUNINN_STORAGE_S3_ENDPOINT: http://minio:9000
      MUNINN_STORAGE_S3_ACCESS_KEY: minioadmin
      MUNINN_STORAGE_S3_SECRET_KEY: minioadmin
      MUNINN_INGESTION_BINANCE_ENABLED: "false"
      MUNINN_INGESTION_COINBASE_ENABLED: "false"

  huginn:
    build:
      context: ../huginn
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      postgres-huginn:
        condition: service_healthy
    ports:
      - "8083:8081"
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPICS: features.obi.v1
      KAFKA_GROUP_ID: huginn-paper-trader
      STRATEGY_NAME: obi
      STRATEGY_THRESHOLD: "0.7"
      STRATEGY_ORDER_SIZE: "0.01"
      LIVE_EXECUTION: "true"
      KAFKA_INTENTS_TOPIC: executions.intents.v1
      KAFKA_FILLS_TOPIC: executions.fills.v1
      DATABASE_ENABLED: "true"
      DATABASE_URL: postgres://postgres:postgres@postgres-huginn:5432/huginn?sslmode=disable
      CAPITAL_INITIAL_CASH: "100000"
      SERVER_PORT: "8081"

  sleipnir:
    build:
      context: ../sleipnir
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_INTENTS_TOPIC: executions.intents.v1
      KAFKA_FILLS_TOPIC: executions.fills.v1
      KAFKA_CONSUMER_GROUP: sleipnir-gateway
      EXCHANGE_BACKEND: sim
      RATE_LIMIT_RPS: "10.0"
      PORT: "8080"
      DB_PATH: /app/data/sleipnir.db
    volumes:
      - sleipnir-data:/app/data

volumes:
  sleipnir-data:
