version: 2

# Dependabot configuration for muninn.
# Watches:
#   - Maven dependencies in pom.xml
#   - GitHub Actions used by .github/workflows/*
#   - Docker base images referenced from Dockerfile and docker-compose.yml
#
# Cadence is weekly; runtime libraries are grouped to reduce PR churn.
# Security updates (CVE-driven) bypass the schedule per Dependabot defaults.

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      spring:
        applies-to: version-updates
        patterns:
          - "org.springframework.*"
          - "org.springframework.boot:*"
          - "org.springframework.kafka:*"
      testing:
        applies-to: version-updates
        patterns:
          - "org.testcontainers:*"
          - "org.junit.*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "com.tngtech.archunit:*"
      aws-sdk:
        applies-to: version-updates
        patterns:
          - "software.amazon.awssdk:*"
      # tomcat-embed-core and tomcat-embed-websocket are released as a set and
      # are pinned together in dependencyManagement. Ungrouped, dependabot opens
      # one PR per artifact, so merging either alone leaves Spring's embedded
      # server running mismatched halves until the other lands. Same shape as
      # the codeql-action split fixed in muninn-py#51.
      tomcat-embed:
        applies-to: version-updates
        patterns:
          - "org.apache.tomcat.embed:*"
      # httpcore5 and httpcore5-h2 are released together, are pinned together in
      # dependencyManagement, and h2 depends on core internals. Ungrouped they
      # arrived as #61 and #62, each bumping one half. Same trap as tomcat-embed
      # above and codeql-action in muninn-py; the third time, so grouped by
      # family rather than by artifact.
      httpcomponents:
        applies-to: version-updates
        patterns:
          - "org.apache.httpcomponents.*"
      hadoop-parquet:
        applies-to: version-updates
        patterns:
          - "org.apache.hadoop:*"
          - "org.apache.parquet:*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
