name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven version
        run: mvn --version

      - name: Unit tests (Surefire) + architecture rules
        run: mvn -B -ntp test

      - name: Integration tests (Failsafe, Testcontainers)
        run: mvn -B -ntp verify -DskipUnitTests=false

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 14

  smoke-test:
    name: smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build (skip tests; already verified above)
        run: mvn -B -ntp -DskipTests -DskipITs package

      - name: Bring up infrastructure
        run: docker compose up -d --wait
        timeout-minutes: 5

      - name: Show compose status
        if: always()
        run: docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
