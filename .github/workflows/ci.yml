name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven version
        run: mvn --version

      - name: Unit tests (Surefire) + architecture rules
        run: mvn -B -ntp test

      - name: Integration tests (Failsafe, Testcontainers)
        run: mvn -B -ntp verify -DskipUnitTests=false

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 14

  smoke-test:
    name: smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # Smoke-test pulls images from external registries (docker.redpanda.com,
    # minio, postgres). Transient registry issues should not redden CI for
    # what is, at this layer, an availability check. Treat failures as a
    # signal in the run summary, not a blocking gate.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build (skip tests; already verified above)
        run: mvn -B -ntp -DskipTests -DskipITs package

      - name: Pull images (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Pull attempt $attempt"
            if docker compose pull --quiet; then
              echo "Pull succeeded"
              exit 0
            fi
            sleep 10
          done
          echo "Pull failed after 3 attempts"
          exit 1

      - name: Bring up infrastructure
        # Start the full stack (including the one-shot minio-init bucket
        # creator), then --wait only on the long-running, health-checked
        # services. Plain `docker compose up --wait` treats minio-init's clean
        # exit (0) as a stack failure because no service declares a
        # service_completed_successfully dependency on it.
        run: |
          docker compose up -d
          docker compose up -d --wait postgres redpanda minio
        timeout-minutes: 5

      - name: Show compose status
        if: always()
        run: docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
