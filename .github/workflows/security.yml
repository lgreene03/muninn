name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 05:17 UTC. Off-peak minute to avoid the top-of-hour rush.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Least-privilege default; jobs widen as needed.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # security-extended adds higher-signal queries beyond the default set.
          queries: security-extended

      # Build the project so CodeQL can trace the Java source. Skip tests and
      # integration tests: this is a static-analysis build, not a verification.
      - name: Build for analysis
        run: mvn -B -ntp -DskipTests -DskipITs compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  dependency-check:
    name: OWASP dependency-check (CVE scan)
    # Runs on the weekly schedule + on demand, NOT on every push/PR. The OWASP
    # NVD update is heavy (~360k-record cold build) and depends on NVD's public
    # API, which is periodically rate-limited (429) or down (503) — gating every
    # commit on an external service's uptime is fragile. The per-push security
    # signal is covered by CodeQL (SAST, above) + Dependabot (dependency-CVE
    # alerts); this job still performs the full dependency-CVE scan weekly and on
    # demand, caching the NVD database (see the cache step) so scheduled runs are
    # fast and resilient once seeded.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Generous headroom for the FIRST cold NVD database build (~360k records);
    # subsequent runs restore the cached dataDirectory and only fetch the delta,
    # so they finish in a couple of minutes.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Persist the downloaded NVD database between runs. The root cause of this
      # job failing was the NVD feed returning HTTP 429 (rate-limited) mid-download
      # when fetched fresh on every run without an API key. Caching the data
      # directory means each run restores the previous run's NVD database (via the
      # restore-keys prefix) and only fetches the incremental delta, so a transient
      # throttle no longer forces a full re-download. The unique run_id in the
      # primary key makes every run save an updated cache entry on success.
      - name: Restore NVD data cache
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-data-${{ runner.os }}-

      - name: Run OWASP dependency-check
        # NVD_API_KEY is read from a repo secret. WITH a key NVD allows ~50 req/30s,
        # so the inter-request delay must be small (1000ms ≈ 30 req/30s, safely under
        # the limit) — the old 6000ms value was a KEYLESS mitigation that throttled
        # the authenticated download to a crawl (~10k of 360k records per 20 min).
        # nvdMaxRetryCount still backs off on a transient 429/5xx, and the cached
        # dataDirectory means most runs only fetch the incremental delta.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DnvdApiDelay=1000 \
            -DnvdMaxRetryCount=20 \
            -DdataDirectory="$HOME/.dependency-check/data" \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON
        # NOTE: failBuildOnCVSS=7 makes this a real gate (was 11 = never failed on
        # a CVE). If a genuine CVE >= 7 surfaces, the fix is to bump the offending
        # dependency (or add a documented, scoped suppression) — not to relax this.

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14
