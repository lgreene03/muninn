name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Twice weekly, Monday + Thursday 05:17 UTC. Off-peak minute to avoid the
    # top-of-hour rush. NOT weekly: GitHub evicts an Actions cache after 7 days
    # without an access, so a once-a-week job sits exactly on the eviction
    # boundary and keeps finding its NVD database gone. Two runs a week keep the
    # cache warm with room to spare.
    - cron: "17 5 * * 1,4"
  workflow_dispatch:

# Least-privilege default; jobs widen as needed.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # security-extended adds higher-signal queries beyond the default set.
          queries: security-extended

      # Build the project so CodeQL can trace the Java source. Skip tests and
      # integration tests: this is a static-analysis build, not a verification.
      - name: Build for analysis
        run: mvn -B -ntp -DskipTests -DskipITs compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  dependency-check:
    name: OWASP dependency-check (CVE scan)
    # Runs on the weekly schedule + on demand, NOT on every push/PR. The OWASP
    # NVD update is heavy (~360k-record cold build) and depends on NVD's public
    # API, which is periodically rate-limited (429) or down (503) — gating every
    # commit on an external service's uptime is fragile. The per-push security
    # signal is covered by CodeQL (SAST, above) + Dependabot (dependency-CVE
    # alerts); this job still performs the full dependency-CVE scan on its schedule
    # demand, caching the NVD database (see the cache step) so scheduled runs are
    # fast and resilient once seeded.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Headroom for a cold NVD database build (387k records as of 2026-09).
    # Subsequent runs restore the cached dataDirectory and only fetch the delta,
    # so they finish in a couple of minutes. The scan step below carries its
    # own, smaller timeout so a slow download fails THAT STEP rather than
    # cancelling the job, which would skip the cache-save step underneath it.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Persist the downloaded NVD database between runs, so each run restores the
      # previous run's database via the restore-keys prefix and fetches only the
      # incremental delta.
      #
      # This is deliberately actions/cache/restore + actions/cache/save rather
      # than the combined actions/cache. The combined action only saves in
      # post-job ON SUCCESS, which created a deadlock that kept this job red from
      # 2026-08-10 onward: a cold 387k-record build overran the job timeout, the
      # job was cancelled, so the cache was never saved, so the next run was cold
      # again and overran again. Five consecutive cancelled runs, and it could
      # never recover on its own. Saving unconditionally means a run that does
      # not finish still banks the records it did download, and successive runs
      # converge instead of restarting from nothing.
      - name: Restore NVD data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-data-${{ runner.os }}-

      - name: Run OWASP dependency-check
        # NVD_API_KEY is read from a repo secret. WITH a key NVD allows ~50 req/30s,
        # so the inter-request delay must be small (1000ms ≈ 30 req/30s, safely under
        # the limit) — the old 6000ms value was a KEYLESS mitigation that throttled
        # the authenticated download to a crawl (~10k of 360k records per 20 min).
        # nvdMaxRetryCount still backs off on a transient 429/5xx, and the cached
        # dataDirectory means most runs only fetch the incremental delta.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Below the job timeout on purpose: overrunning must fail THIS STEP and
        # leave the job alive long enough to reach the cache-save step, rather
        # than cancelling the job and losing the partial database.
        timeout-minutes: 90
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DnvdApiDelay=1000 \
            -DnvdMaxRetryCount=20 \
            -DdataDirectory="$HOME/.dependency-check/data" \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON
        # NOTE: failBuildOnCVSS=7 makes this a real gate (was 11 = never failed on
        # a CVE). If a genuine CVE >= 7 surfaces, the fix is to bump the offending
        # dependency (or add a documented, scoped suppression) — not to relax this.

      # Unconditional: bank whatever NVD records this run managed to download,
      # even on a timeout or a CVE-gate failure. This is the half that breaks the
      # deadlock described above.
      - name: Save NVD data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-data-${{ runner.os }}-${{ github.run_id }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14
