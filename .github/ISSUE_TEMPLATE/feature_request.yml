name: Feature request
description: Propose a new feature or capability for Muninn.
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check [NON_GOALS.md](../../docs/steering/NON_GOALS.md).
        Proposals that conflict with non-goals will be closed.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who experiences it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: What would the feature look like? How would a user interact with it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why is this one preferred?

  - type: textarea
    id: steering
    attributes:
      label: Steering docs affected
      description: Which steering docs would this change? List them or write "none".
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      description: Which phase do you think this belongs in? See ROADMAP.md.
      options:
        - Phase 0 — steering docs / repo skeleton
        - Phase 1 — local ingestion
        - Phase 2 — canonical events
        - Phase 3 — feature engine
        - Phase 4 — replay engine
        - Phase 5 — query API
        - Phase 6 — observability
        - Phase 7 — docs / demo polish
        - Phase 8 — production-reference
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read NON_GOALS.md and confirmed this is not excluded.
          required: true
        - label: I have searched existing issues for duplicates.
          required: true
