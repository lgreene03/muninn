name: Bug report
description: Report a defect in Muninn.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below.
        Before submitting, search existing issues to avoid duplicates.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps. The smaller the reproduction, the faster the fix.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / git SHA
      placeholder: "e.g. 0.1.0-SNAPSHOT or commit 1a2b3c4"
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Deployment profile
      options:
        - local-lite
        - local-full
        - cloud-cheap
        - production-reference
        - other / unknown
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, JDK version, Docker version, hardware notes.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / metrics / traces
      description: Relevant excerpts. Please redact secrets.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have included reproduction steps.
          required: true
